services:
  frontend:
    build:  
      context: ./client
      dockerfile: Dockerfile
    container_name: taskfrontend
    ports: 
       - "5173:5173"
    env_file:
       - ./client/.env
    networks:
       - taskflow
  
  backend:
    build:  
      context: ./server
      dockerfile: Dockerfile
    container_name: taskbackend
    ports: 
       - "5000:5000"
    env_file:
       - ./server/.env
    networks:
       - taskflow

  mongo:
    image: mongo:latest
    container_name: taskmongo
    ports:
      - "27017:27017"
networks:
  taskflow:
    driver: bridge

volumes:
  mongo-data: